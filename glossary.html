<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用語集｜ITエンジニアガイド</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: 用語集。各章で点線の付いた言葉を、5つのまとまりに分けてカードで並べる。中身は glossary.js から作る */
/* 色・書体・カードは chapter1.html と同じ決まりにそろえる */
:root {
  color-scheme: light;
  --bg: #f5f7fb;
  --surface: #ffffff;
  --ink: #1f2a44;
  --muted: #5d6880;
  --line: #e3e8f2;
  --primary: #3b5bdb;
  --primary-soft: #edf1ff;
  --c1: #3b5bdb; --c1s: #edf1ff;
  --c2: #0ca678; --c2s: #e3f8f0;
  --c3: #e67700; --c3s: #fff3db;
  --c4: #7048e8; --c4s: #f1ecff;
  --c6: #1098ad; --c6s: #e3f6f9;
  --radius: 18px;
  --shadow: 0 1px 2px rgba(31, 42, 68, .05), 0 8px 24px rgba(31, 42, 68, .06);
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 16px; line-height: 1.75; word-break: auto-phrase;
}
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; line-height: 1.35; margin: 0; }
p { margin: 0; }
.ic { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.app-top {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 28px; padding: 12px 28px;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 700; font-size: 15px; white-space: nowrap; }
.brand .ic { color: var(--primary); }
a.brand { color: var(--ink); text-decoration: none; }
a.brand:hover { color: var(--primary); }
.steps { display: flex; gap: 6px; list-style: none; margin: 0; padding: 0; flex-wrap: wrap; }
.steps .st {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; color: var(--muted); padding: 6px 14px 6px 6px; text-decoration: none;
  border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
}
.steps .st b {
  display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
  background: var(--line); color: var(--muted); font-family: var(--font-display); font-size: 12px;
}
.steps a.st:hover { border-color: var(--primary); color: var(--primary); }
.steps a.st:hover b { background: var(--primary-soft); color: var(--primary); }

main { padding: 44px 48px 64px; }
.wrap { width: 100%; max-width: 1400px; margin: 0 auto; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; margin-bottom: 20px; }
.eyebrow { font-family: var(--font-display); font-weight: 700; color: var(--primary); font-size: 15px; letter-spacing: .08em; }
.head h1 { font-size: 44px; font-weight: 900; margin-top: 6px; }
.head .lead { color: var(--muted); font-size: 16px; max-width: 34em; }

/* まとまりへのジャンプ */
.jump { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 36px; }
.jump a {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px 6px 8px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); color: var(--ink); text-decoration: none; font-size: 14px;
}
.jump a:hover { border-color: var(--tone); color: var(--tone); }
.jump .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--tone-soft); color: var(--tone); }
.jump .dot .ic { width: 14px; height: 14px; }
.jump .n { color: var(--muted); font-size: 12px; }

.group { margin-bottom: 40px; scroll-margin-top: 80px; }
.group-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.tile { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; flex: none; background: var(--tone-soft); color: var(--tone); }
.group-head h2 { font-size: 24px; font-weight: 900; }
.group-head .n { font-size: 13px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.term-card {
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  position: relative; overflow: hidden; padding: 20px 20px 20px;
}
.term-card::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: var(--tone); }
.term-card h3 { font-size: 20px; font-weight: 700; }
.term-card .full { display: block; font-size: 12px; color: var(--muted); line-height: 1.4; margin-top: 2px; min-height: 1.4em; }
.term-card p { margin-top: 10px; font-size: 15px; text-wrap: pretty; }

.tone-1 { --tone: var(--c1); --tone-soft: var(--c1s); }
.tone-2 { --tone: var(--c2); --tone-soft: var(--c2s); }
.tone-3 { --tone: var(--c6); --tone-soft: var(--c6s); }
.tone-4 { --tone: var(--c3); --tone-soft: var(--c3s); }
.tone-5 { --tone: var(--c4); --tone-soft: var(--c4s); }

@media (max-width: 1200px) { .grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 960px) {
  .app-top { flex-wrap: wrap; gap: 12px; padding: 12px 16px; }
  main { padding: 24px 16px 48px; }
  .head { flex-direction: column; align-items: flex-start; gap: 12px; }
  .head h1 { font-size: 34px; }
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-guide" viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M13 4h5.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H13z"/></symbol>
  <symbol id="i-bag" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></symbol>
  <symbol id="i-vee" viewBox="0 0 24 24"><path d="M3 5l9 15 9-15"/><path d="M7.5 9h9" stroke-dasharray="2 2"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol>
  <symbol id="i-code" viewBox="0 0 24 24"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 6l-3 12"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M10 3l1.8 5.2L17 10l-5.2 1.8L10 17l-1.8-5.2L3 10l5.2-1.8z"/><path d="M18 14l.9 2.1L21 17l-2.1.9L18 20l-.9-2.1L15 17l2.1-.9z"/></symbol>
</svg>
<header class="app-top">
  <a class="brand" href="index.html" title="目次へ"><svg class="ic"><use href="#i-guide"/></svg>ITエンジニアガイド</a>
  <ol class="steps" aria-label="資料の章">
    <li><a class="st" href="chapter1.html"><b>1</b>プログラマーの仕事</a></li>
    <li><a class="st" href="chapter2.html"><b>2</b>Webサービスができるまで</a></li>
    <li><a class="st" href="chapter3.html"><b>3</b>必要な知識</a></li>
    <li><a class="st" href="chapter4.html"><b>4</b>転職までの道のり</a></li>
  </ol>
</header>
<main>
  <div class="wrap">
    <div class="head">
      <div>
        <p class="eyebrow">GLOSSARY</p>
        <h1>用語集</h1>
      </div>
      <p class="lead">資料の中で、点線の付いた言葉をまとめました。本文では、点線の言葉にカーソルを合わせると、ここと同じ説明が出ます。</p>
    </div>
    <nav class="jump" aria-label="用語のまとまり"></nav>
    <div id="groups"></div>
  </div>
</main>
<script src="glossary.js"></script>
<script>
// glossary.js の GLOSSARY_GROUPS から、まとまりごとのカードを作る
document.querySelector('.jump').innerHTML = GLOSSARY_GROUPS.map((g, i) =>
  `<a class="tone-${i + 1}" href="#g${i + 1}"><span class="dot"><svg class="ic"><use href="#${g.icon}"/></svg></span>${g.title}<span class="n">${g.terms.length}</span></a>`).join('');
document.getElementById('groups').innerHTML = GLOSSARY_GROUPS.map((g, i) => `
  <section class="group tone-${i + 1}" id="g${i + 1}">
    <div class="group-head"><span class="tile"><svg class="ic"><use href="#${g.icon}"/></svg></span><h2>${g.title}</h2><span class="n">${g.terms.length}語</span></div>
    <div class="grid">${g.terms.map(t => `
      <article class="term-card"><h3>${t.name}</h3><span class="full">${t.full || ''}</span><p>${t.desc}</p></article>`).join('')}
    </div>
  </section>`).join('');
</script>
</body>
</html>
